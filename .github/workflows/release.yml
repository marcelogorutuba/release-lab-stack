# Umbrella release: tag + GitHub Release only. The images are published by each
# family repo; nothing is built here and no registry tag moves.
#
#   push release/X.Y  -> next RC tag (vX.Y.Z-rc.N) + prerelease
#   push main (merge of release/X.Y, tree equal to its last RC)
#                     -> vX.Y.Z + final release
#   any other push on main -> nothing
name: Release

on:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve
        id: r
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags --quiet
          mode=skip version=''

          if [[ "$REF" == refs/heads/release/* ]]; then
            line=${REF_NAME#release/}
            [[ "$line" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::release branches must be named release/X.Y, got $REF_NAME"; exit 1; }
            existing=$(git tag --points-at HEAD --list "v$line.*-rc.*" | sort -V | tail -1)
            if [ -n "$existing" ]; then
              echo "$existing already points at this commit: nothing to do."
            else
              last_final=$(git tag --list "v$line.*" | grep -v -- '-rc\.' | sort -V | tail -1 || true)
              if [ -n "$last_final" ]; then base="$line.$(( ${last_final##*.} + 1 ))"; else base="$line.0"; fi
              last_rc=$(git tag --list "v$base-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -1)
              version="v$base-rc.$(( ${last_rc:-0} + 1 ))"
              mode=rc
            fi

          elif [ "$REF" = refs/heads/main ]; then
            merged=$(git rev-parse -q --verify HEAD^2 || true)
            branch=""
            if [ -n "$merged" ]; then
              branch=$(git branch -r --contains "$merged" --format='%(refname:short)' | grep '^origin/release/' | sort -V | tail -1 || true)
            fi
            if [ -z "$branch" ]; then
              echo "Push on main is not a merge of a release branch: nothing to release."
            else
              line=${branch#origin/release/}
              rc=$(git tag --list "v$line.*-rc.*" | sort -V | tail -1)
              [ -n "$rc" ] || { echo "::error::$branch was merged but has no RC tag"; exit 1; }
              if [ "$(git rev-parse "$rc^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ]; then
                echo "::error::main does not match the last RC ($rc). Refusing to release."
                exit 1
              fi
              version=${rc%-rc.*}
              if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
                echo "::error::$version already exists"; exit 1
              fi
              mode=promote
            fi

          else
            echo "::error::Unsupported ref $REF"; exit 1
          fi

          notes_start=$(git tag --list 'v*' | grep -v -- '-rc' | sort -V | tail -1 || true)
          { echo "mode=$mode"; echo "version=$version"; echo "notes_start=$notes_start"; } >> "$GITHUB_OUTPUT"
          echo "mode=$mode version=$version"

      - name: Create tag and release
        if: steps.r.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.r.outputs.version }}
          MODE: ${{ steps.r.outputs.mode }}
          NOTES_START: ${{ steps.r.outputs.notes_start }}
        run: |
          set -euo pipefail
          if [ "$MODE" = promote ]; then kind=(--latest); else kind=(--prerelease --latest=false); fi
          start=(); [ -n "$NOTES_START" ] && start=(--notes-start-tag "$NOTES_START")
          {
            echo "Each submodule is pinned to the release branch of its repo:"
            git submodule status | awk '{s = $1; sub(/^[-+U]/, "", s); print "- " $2 " @ " substr(s, 1, 7)}'
          } > /tmp/notes.md
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file /tmp/notes.md --generate-notes "${start[@]}" "${kind[@]}"
